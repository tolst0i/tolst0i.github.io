<style>
/* Layout: editor column (list + form) beside a sticky live preview; stacks under 1100px. Single dark look, matching the forum. */
:root{
  color-scheme:dark;
  --bg:#0d0d0d; --panel:#161616; --card:#1e1e1e; --card2:#262626; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --t0:#fcfcfa; --t1:#d6d2cb; --t2:#8a857e; --t3:#4a4640;
  --acc:#A4AE1C; --acc2:#bcc920; --accg:rgba(164,174,28,.08); --accb:rgba(164,174,28,.3);
  --bad:#e05050; --ok:#34c764; --warn:#d1a23a;
  --ff:'Krona One','Arial Black',sans-serif; --fm:'DM Mono',ui-monospace,Consolas,monospace; --ft:'Sansation','Trebuchet MS',sans-serif;
}
html,body{background:var(--bg);color:var(--t1)}
body{font:400 14px/1.5 var(--ft);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
.ed{max-width:1500px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.ed-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.ed-brand{display:flex;align-items:center;gap:12px}
.ed-gem{width:18px;height:22px;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);background:linear-gradient(90deg,var(--acc) 50%,var(--acc2) 50%)}
.ed-brand h1{margin:0;font:400 17px/1 var(--ff);letter-spacing:.12em;text-transform:uppercase;color:var(--t0)}
.ed-brand small{display:block;margin-top:6px;font:400 10px/1 var(--fm);letter-spacing:.24em;text-transform:uppercase;color:var(--t2)}
.ed-status{display:inline-flex;align-items:center;gap:8px;font:400 10.5px/1 var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--t2)}
.ed-status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--t3)}
.ed-status[data-s=ok]::before{background:var(--ok)}
.ed-status[data-s=saving]::before{background:var(--warn)}
.ed-status[data-s=local]::before{background:var(--warn)}
.ed-status[data-s=err]::before{background:var(--bad)}
.ed-tabs{display:flex;flex-wrap:wrap;gap:4px}
.ed-tab{padding:9px 14px;border:1px solid var(--line);border-radius:6px;background:transparent;font:400 10.5px/1 var(--fm);letter-spacing:.2em;text-transform:uppercase;color:var(--t2);cursor:pointer}
.ed-tab:hover{color:var(--t0);border-color:var(--line2)}
.ed-tab[aria-selected=true]{background:var(--acc);border-color:var(--acc);color:#111}
.ed-tab em{font-style:normal;opacity:.7;margin-left:6px}
.ed-main{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
@media (min-width:1100px){.ed-main{grid-template-columns:minmax(0,560px) minmax(0,1fr)}.ed-prev{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px)}}
.ed-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.ed-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.ed-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;font:400 10px/1 var(--fm);letter-spacing:.28em;text-transform:uppercase;color:var(--t2)}
.ed-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ed-cat{margin:10px 2px 2px;font:400 9.5px/1 var(--fm);letter-spacing:.28em;text-transform:uppercase;color:var(--t3)}

.ed-item{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px}

.ed-pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:4px 0;background:none;border:0;text-align:left;color:inherit;cursor:pointer;font:inherit}
.ed-sw{flex:none;width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:var(--sw,var(--t3))}
.ed-pick b{display:block;font:700 13.5px/1.25 var(--ft);color:var(--t0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ed-pick small{display:block;font:400 9.5px/1.4 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--t2)}
.ed-pick span{min-width:0}
.ed-ib{flex:none;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--t2);font:500 13px/1 var(--fm);cursor:pointer}
.ed-ib:hover{color:var(--t0);border-color:var(--line2)}

.ed-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border:1px solid var(--line2);border-radius:7px;background:transparent;font:400 10.5px/1 var(--fm);letter-spacing:.18em;text-transform:uppercase;color:var(--t1);cursor:pointer}
.ed-btn:hover{border-color:var(--accb);color:var(--acc)}
.ed-btn.pri{background:var(--acc);border-color:var(--acc);color:#111}
.ed-btn.pri:hover{background:var(--acc2);color:#111}
.ed-btn.bad{border-color:rgba(224,80,80,.5);color:var(--bad)}
.ed-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ed-empty{padding:18px;border:1px dashed var(--line2);border-radius:10px;font:400 12px/1.6 var(--fm);color:var(--t2)}
.ed-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ed-f{display:flex;flex-direction:column;gap:6px;min-width:0}
.ed-f.w{grid-column:1/-1}
.ed-f label,.ed-lab{font:400 9.5px/1.2 var(--fm);letter-spacing:.2em;text-transform:uppercase;color:var(--t2)}
.ed-f .hint{font:400 10.5px/1.4 var(--fm);color:var(--t3)}
input[type=text],input[type=url],select,textarea{width:100%;min-width:0;padding:9px 10px;background:var(--card);border:1px solid var(--line2);border-radius:7px;color:var(--t0);font:400 13.5px/1.4 var(--ft)}
textarea{min-height:110px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ed-chk{display:inline-flex;align-items:center;gap:8px;font:400 12.5px/1.3 var(--ft);color:var(--t1);text-transform:none;letter-spacing:0}
.ed-chk input{width:16px;height:16px;accent-color:var(--acc)}
.ed-rep{display:flex;flex-direction:column;gap:6px}
.ed-rr{display:flex;gap:6px;align-items:flex-start}
.ed-rr>*{min-width:0}

.ed-rr input,.ed-rr textarea{flex:1}
.ed-rr .sub{flex:1;display:flex;flex-direction:column;gap:6px}
.ed-rr textarea{min-height:80px}
.ed-sws{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ed-swb{width:28px;height:28px;border-radius:6px;border:2px solid transparent;background:var(--c);cursor:pointer}
.ed-swb[aria-pressed=true]{border-color:var(--t0)}
.ed-swb.none{background:repeating-linear-gradient(135deg,var(--card2) 0 4px,var(--card) 4px 8px)}
.ed-sws input[type=color]{width:34px;height:28px;padding:0;border:1px solid var(--line2);border-radius:6px;background:none;cursor:pointer}
.ed-confirm{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px;border:1px solid rgba(224,80,80,.4);border-radius:8px;background:rgba(224,80,80,.06);font:400 12px/1.4 var(--fm);color:var(--t1)}
.ed-prev{display:flex;flex-direction:column;gap:10px;min-width:0}
.ed-prevbox{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#0b0b0b;padding:12px;min-height:300px}
.ed-prevbox .nm{margin:0 auto}
.ed-note{font:400 10.5px/1.5 var(--fm);color:var(--t3)}
.ed-code{width:100%;min-height:260px;font:400 11px/1.5 var(--fm);color:var(--t1);background:var(--card);white-space:pre-wrap;word-break:break-all}
.ed-meter{font:400 11px/1.4 var(--fm);color:var(--t2)}
.ed-meter b{font-weight:500;color:var(--t0)}
.ed-meter.warn b{color:var(--warn)}
.ed-meter.bad b{color:var(--bad)}
.ed-toast{font:400 11px/1.4 var(--fm);color:var(--ok);min-height:1em}
.ed-seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.ed-seg button{padding:8px 12px;border:0;background:transparent;font:400 10px/1 var(--fm);letter-spacing:.16em;text-transform:uppercase;color:var(--t2);cursor:pointer}
.ed-seg button[aria-pressed=true]{background:var(--card2);color:var(--t0)}
@media (max-width:560px){.ed-form{grid-template-columns:minmax(0,1fr)}.ed-rr{flex-wrap:wrap}.ed-rr select{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="ed">
  <header class="ed-top">
    <div class="ed-brand"><i class="ed-gem"></i><div><h1>Atelier Middletown</h1><small>Générateur du menu Nihilum : Middletown Stories</small></div></div>

<script>
const DEFAULT_SETTINGS = {banSam:'https://i.imgur.com/9PLgXZi.jpeg', banBart:'https://i.imgur.com/EI8Frdk.jpeg', locL:'Middletown · Campagne préfectorale', locR:'Triomphe · 3178'};
const PRESETS = [['Nihilum','#A4AE1C'],['Rouge','#e05050'],['Triomphe','#1298b0'],['Or','#d1a23a'],['EREBOS','#8b3ef5'],['Irréel','#C22222'],['Vert','#34c764']];
const JCATS = ['Intrigue principale','Annexes','Terminées'];
const XCATS = ['Cercle intime','Campagne','Soutiens','Adversaires','Middletown'];
const STATUS = {live:'En cours', wait:'En attente', done:'Terminé'};

/* ---------------- state ---------------- */
const S = {journal:new Map(), codex:new Map(), settings:{...DEFAULT_SETTINGS}, tab:'journal', sel:{journal:null, codex:null}, pmode:'ui', db:null, confirm:null};
const dirty = new Set(); const timers = {}; const inflight = {}; const again = {};
const $ = s => document.querySelector(s);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cssUrl = u => String(u||'').trim().replace(/[\s'"()<>\\]/g, c => encodeURIComponent(c));
const safeHref = u => /^https?:\/\//i.test(String(u||'').trim()) ? String(u).trim() : '';
const sorted = kind => [...S[kind].entries()].map(([id,d])=>({id,...d})).sort((a,b)=>(a.order??0)-(b.order??0));
const uid = () => 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------------- color ---------------- */
function hexRgb(h){h=String(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);if(isNaN(n)||h.length!==6)return null;return [n>>16&255,n>>8&255,n&255];}
function colorVars(hex){
  const c=hexRgb(hex); if(!c) return '';
  const [r,g,b]=c; const l=x=>{x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)};
  const lum=.2126*l(r)+.7152*l(g)+.0722*l(b);
  const a2='#'+c.map(v=>Math.min(255,Math.round(v+(255-v)*.14)).toString(16).padStart(2,'0')).join('');
  const reddish = r>g*1.4 && r>b*1.4;
  return `--a:${hex};--a2:${a2};--ad:rgba(${r},${g},${b},.18);--ag:rgba(${r},${g},${b},.06);--ab:rgba(${r},${g},${b},.3);--ink:${lum>.18?'#111':'#fcfcfa'};--gl:${reddish?'#21BAD5':'#e05050'}`;
}

/* ---------------- generator (barebones) ---------------- */
const CSS_SRC = `
.nm{--a:#A4AE1C;max-width:940px;margin:16px auto;text-align:left;color:#d2cec7;font:14px/1.6 Sansation,'Trebuchet MS',sans-serif}
.nm>input{position:absolute;opacity:0;width:1px;height:1px}
.nmi{background:#151515;border:1px solid #2c2c2c;border-radius:8px;overflow:hidden}
.nmt{padding:22px 16px 16px}
.nmu{display:none}
#nmgo:checked~.nmi .nmt{display:none}
#nmgo:checked~.nmi .nmu{display:block}
.nmh{margin:0 0 16px;text-align:center;font:30px/1 'Krona One',sans-serif;letter-spacing:4px;color:#f4f2ee}
.nmh span{display:block;margin-top:8px;font:10px/1 'DM Mono',monospace;letter-spacing:4px;text-transform:uppercase;color:#8a857e}
.nmb{display:block;margin:0 0 10px;border:1px solid #2c2c2c;border-radius:6px;overflow:hidden;background:#1d1d1d}
.nmb img{display:block;width:100%;height:140px;object-fit:cover}
.nmb div{padding:10px 12px;font:15px/1.3 'Krona One',sans-serif;text-transform:uppercase;color:#f4f2ee}
.nmb small{display:block;margin-bottom:4px;font:10px/1 'DM Mono',monospace;letter-spacing:2px;color:#8a857e}
.nmb b{float:right;font:10px/1.8 'DM Mono',monospace;letter-spacing:2px}
.nmo{cursor:pointer}
.nmo b{color:var(--a)}
.nmo:hover{border-color:var(--a)}
.nmk img{filter:grayscale(1) brightness(.6)}
.nmk b{color:#e05050}
.nmk .r,.nmk:hover .v{display:none}
.nmk:hover .r{display:inline}
.nmn{padding:10px 16px;border-bottom:1px solid #2c2c2c;font:10px/1 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase}
.nm label{font-weight:inherit;text-transform:none;letter-spacing:normal}
.nmn label{display:inline-block;margin-right:4px;padding:7px 10px;border-radius:4px;font:10px/1 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:#8a857e;cursor:pointer}
.nmn .m{float:right;margin:0}
#nmtj:checked~.nmi label[for=nmtj],#nmtc:checked~.nmi label[for=nmtc]{background:var(--a);color:#111}
.nmv{display:none;padding:16px}
#nmtj:checked~.nmi .nmvj,#nmtc:checked~.nmi .nmvc{display:flex;flex-wrap:wrap;gap:16px}
.nml{flex:1 1 200px;min-width:0}
.nmc{margin:12px 0 6px;font:10px/1 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:#6f6a64}
.nmc:first-child{margin-top:0}
.nme{display:flex;align-items:center;gap:10px;margin:0 0 5px;padding:6px 8px;background:#1d1d1d;border:1px solid #2c2c2c;border-left:3px solid #2c2c2c;border-radius:5px;cursor:pointer}
.nme img{flex:none;width:36px;height:36px;object-fit:cover;border-radius:4px}
.nme span{min-width:0;font:700 13px/1.3 Sansation,sans-serif;color:#d2cec7}
.nme small{display:block;font:9.5px/1.4 'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:#8a857e}
.nme em{margin-left:auto;font:normal 9px/1 'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--a)}
.nmp{display:none;flex:3 1 400px;min-width:0;padding:18px;background:#1a1a1a;border:1px solid #2c2c2c;border-top:2px solid var(--a);border-radius:6px}
.nmy{font:10px/1 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:var(--a)}
.nmnm{margin:8px 0 4px;font:21px/1.25 'Krona One',sans-serif;text-transform:uppercase;color:#f4f2ee}
.nmsub{margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid #2c2c2c;font:10.5px/1.5 'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:#8a857e}
.nmg{display:flex;flex-wrap:wrap;gap:16px}
.nmlc{flex:1 1 150px;max-width:190px}
.nmlc img{display:block;width:100%;height:240px;margin:0 0 6px;object-fit:cover;object-position:50% 15%;border-radius:6px}
.nmti{margin:0 0 5px;padding:7px 10px;background:#1f1f1f;border:1px solid #2c2c2c;border-radius:5px;font:700 12.5px/1.3 Sansation,sans-serif}
.nmti small{display:block;font:9.5px/1.4 'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;color:var(--a)}
.nm a.nmgo{display:block;padding:9px 10px;border-radius:5px;background:var(--a);font:10px/1 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:#111;text-decoration:none}
.nmrc{flex:999 1 240px;min-width:0}
.nmsh{margin:0 0 6px;font:10px/1 'DM Mono',monospace;letter-spacing:2px;text-transform:uppercase;color:#6f6a64}
.nmob{margin:0 0 16px;padding:0;list-style:none}
.nmob li{margin:0 0 4px;padding:7px 10px;background:#1f1f1f;border:1px solid #2c2c2c;border-radius:5px;font:700 13px/1.4 Sansation,sans-serif}
.nmob li.on{border-color:var(--a);color:#f4f2ee}
.nmob li.ok{color:#6f6a64;text-decoration:line-through}
.nmob i{font-style:normal;color:var(--a)}
.nmw{margin:0 0 16px;font:700 13px/1.6 Sansation,sans-serif}
.nm p.nmtx{margin:0 0 14px;font:15px/1.7 Lora,Georgia,serif;color:#d2cec7}
.nmz{padding:10px;border:1px dashed #2c2c2c;border-radius:5px;font:11px/1.5 'DM Mono',monospace;color:#8a857e}
`;
const CSS_BASE = CSS_SRC.replace(/\s*\n\s*/g,'').replace(/\s*([{};])\s*/g,'$1').replace(/;}/g,'}');
const SEL_ON = '{background:#232323;border-left-color:var(--a)}';

function groups(list){const m=new Map();list.forEach(e=>{const c=(e.cat||'').trim()||'Sans catégorie';if(!m.has(c))m.set(c,[]);m.get(c).push(e);});return [...m.entries()];}
function paras(t){return String(t||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>`<p class="nmtx">${esc(p).replace(/\n/g,'<br>')}</p>`).join('');}
const hexOk = h => /^#[0-9a-f]{6}$/i.test(String(h||''));
const imgUrl = u => { const s=String(u||'').trim(); return /^https?:\/\//i.test(s) ? esc(s) : ''; };
const posOk = p => String(p||'').replace(/[^0-9%.\sa-z-]/gi,'').trim();

function generate(){
  const J=sorted('journal'), X=sorted('codex'), st=S.settings;
  J.forEach((e,n)=>{e.rid='nmj'+(n+1);}); X.forEach((e,n)=>{e.rid='nmx'+(n+1);});
  const all=[...J,...X];
  let css=CSS_BASE;
  if(all.length){
    css+=all.map(e=>`#${e.rid}:checked~.nmi label[for=${e.rid}]`).join(',')+SEL_ON;
    css+=all.map(e=>`#${e.rid}:checked~.nmi .p${e.rid}`).join(',')+'{display:block}';
  }
  let inp='<input type="checkbox" id="nmgo"><input type="radio" name="nmtab" id="nmtj" checked><input type="radio" name="nmtab" id="nmtc">';
  J.forEach((e,n)=>{inp+=`<input type="radio" name="nmj" id="${e.rid}"${n?'':' checked'}>`;});
  X.forEach((e,n)=>{inp+=`<input type="radio" name="nmx" id="${e.rid}"${n?'':' checked'}>`;});
  const sh = t => `<div class="nmsh">// ${esc(t)}</div>`;

  let jl='', jp='';
  for(const [cat,es] of groups(J)){

      const href=safeHref(e.link);

/* ---------------- persistence ---------------- */
function setStatus(s, text){ const el=$('#status'); el.dataset.s=s; el.textContent=text; }
function refreshStatus(){
  if(!S.db){ setStatus('local','Brouillon local, sur cet appareil'); return; }
  const busy = Object.keys(timers).length || Object.keys(inflight).length;
  setStatus(busy?'saving':'ok', busy?'Enregistrement…':'Enregistré');
}
function localSave(){ try{ localStorage.setItem('mts-v1', JSON.stringify({journal:[...S.journal], codex:[...S.codex], settings:S.settings})); }catch(e){} }
function localLoad(){ try{ const d=JSON.parse(localStorage.getItem('mts-v1')||'null'); if(d){ S.journal=new Map(d.journal||[]); S.codex=new Map(d.codex||[]); S.settings={...DEFAULT_SETTINGS,...(d.settings||{})}; } }catch(e){} }
const pathOf = (kind,id) => kind==='settings' ? 'settings/main' : `${kind}/${id}`;
function dataOf(kind,id){ return kind==='settings' ? S.settings : S[kind].get(id); }
function queueSave(kind,id,delay=700){
  const key=pathOf(kind,id); dirty.add(key);
  if(!S.db){ localSave(); return; }
  clearTimeout(timers[key]); timers[key]=setTimeout(()=>{ delete timers[key]; flush(kind,id); }, delay); refreshStatus();
}
async function flush(kind,id){
  const key=pathOf(kind,id);
  if(inflight[key]){ again[key]=true; return; }
  const body=dataOf(kind,id); if(!body){ dirty.delete(key); refreshStatus(); return; }
  inflight[key]=true; refreshStatus();
  try{ await S.db.doc(key).set(JSON.parse(JSON.stringify(body))); }
  catch(e){ setStatus('err', e&&e.code==='quota_exceeded' ? 'Base pleine : supprime des entrées' : 'Échec de l\'enregistrement, réessaie'); delete inflight[key]; return; }
  delete inflight[key];
  if(again[key]){ delete again[key]; return flush(kind,id); }
  if(!timers[key]) dirty.delete(key);
  refreshStatus();
}
async function removeDoc(kind,id){
  const key=pathOf(kind,id); clearTimeout(timers[key]); delete timers[key]; dirty.delete(key);
  S[kind].delete(id);
  if(!S.db){ localSave(); return; }
  try{ await S.db.doc(key).delete(); }catch(e){ setStatus('err','Suppression échouée, réessaie'); return; }
  refreshStatus();
}
function applySnap(kind, snap){
  const seen=new Set();
  snap.docs.forEach(d=>{ seen.add(d.id); const key=pathOf(kind,d.id); if(!dirty.has(key)) S[kind].set(d.id, JSON.parse(JSON.stringify(d.data()))); });
  [...S[kind].keys()].forEach(id=>{ if(!seen.has(id) && !dirty.has(pathOf(kind,id))) S[kind].delete(id); });
  renderLeftIfIdle(); schedulePreview(); counts();
}
function renderLeftIfIdle(){ const a=document.activeElement; if(a && $('#left').contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return; renderLeft(); }

function renderPreview(){

/* ---------------- events ---------------- */
function nextOrder(kind){ const l=sorted(kind); return l.length?(l[l.length-1].order||0)+1:1; }
document.addEventListener('click', ev=>{
  const b=ev.target.closest('button'); if(!b) return;
  if(b.dataset.tab){ S.tab=b.dataset.tab; S.confirm=null; document.querySelectorAll('.ed-tab').forEach(x=>x.setAttribute('aria-selected', x===b)); renderLeft(); schedulePreview(); return; }
  if(b.dataset.m){ S.pmode=b.dataset.m; document.querySelectorAll('#pmode button').forEach(x=>x.setAttribute('aria-pressed', x===b)); renderPreview(); return; }
  const kind=S.tab;
  if(b.id==='add'){
    const id=uid(); const base= kind==='journal'
      ? {order:nextOrder(kind), cat:'Intrigue principale', title:'', place:'', st:'live', date:'', link:'', track:false, steps:[], who:'', summary:''}
      : {order:nextOrder(kind), cat:'Cercle intime', name:'', role:'', img:'', pos:'', color:'', eye:'', sub:'', tag:'', lite:false, tiles:[], obj:[], secs:[{h:'Profil',t:''}], link:'', linkLabel:''};
    S[kind].set(id,base); S.sel[kind]=id; queueSave(kind,id,0); renderLeft(); schedulePreview();
    const first=$('#left [data-form] input'); if(first) first.focus(); return;
  }
  if(b.dataset.pick){ S.sel[kind]=b.dataset.pick; S.confirm=null; renderLeft(); schedulePreview(); return; }
  if(b.dataset.mv){
    const l=sorted(kind), i=l.findIndex(x=>x.id===b.dataset.id), j=i+Number(b.dataset.mv); if(j<0||j>=l.length) return;
    [l[i],l[j]]=[l[j],l[i]];
    l.forEach((x,n)=>{ const d=S[kind].get(x.id); if(d.order!==n+1){ d.order=n+1; queueSave(kind,x.id,0); } });
    renderLeft(); schedulePreview(); return;
  }
  if(b.dataset.del){ S.confirm=b.dataset.del; renderLeft(); return; }
  if(b.hasAttribute('data-delno')){ S.confirm=null; renderLeft(); return; }
  if(b.dataset.delok){ const id=b.dataset.delok; S.confirm=null; removeDoc(kind,id).then(()=>{ renderLeft(); schedulePreview(); counts(); }); renderLeft(); schedulePreview(); return; }
  const form=b.closest('[data-form]');
  if(form && (form.dataset.form==='journal'||form.dataset.form==='codex')){
    const fk=form.dataset.form, id=form.dataset.id, e=S[fk].get(id); if(!e) return;
    if(b.dataset.addrow){ const k=b.dataset.addrow; e[k]=e[k]||[]; e[k].push(k==='steps'?{state:'todo',text:''}:k==='tiles'?{a:'',b:''}:k==='secs'?{h:'',t:''}:''); queueSave(fk,id); renderLeft(); schedulePreview(); return; }
    if(b.dataset.rm){ const k=b.dataset.rm; (e[k]||[]).splice(Number(b.dataset.i),1); queueSave(fk,id); renderLeft(); schedulePreview(); return; }
    if(b.dataset.color!==undefined){ e.color=b.dataset.color; queueSave(fk,id); renderLeft(); schedulePreview(); return; }
  }
  if(b.id==='copy'){ copyText($('#code').value, $('#code'), '#toast'); return; }
  if(b.id==='copyjson'){ const j=$('#json'); j.value=backup(); copyText(j.value, j, '#toast2'); return; }
  if(b.id==='import'){ try{ JSON.parse($('#json').value); S.confirm='import'; const v=$('#json').value; renderLeft(); $('#json').value=v; }catch(e){ $('#toast2').textContent='Ce texte n\'est pas une sauvegarde valide.'; } return; }
  if(b.id==='importok'){ doImport($('#json').value); return; }
});
async function doImport(txt){
  let d; try{ d=JSON.parse(txt); }catch(e){ return; }
  S.confirm=null;
  for(const kind of ['journal','codex']){ for(const id of [...S[kind].keys()]) await removeDoc(kind,id); }
  for(const kind of ['journal','codex']){ (d[kind]||[]).forEach((e,i)=>{ const {id,rid,...rest}=e; const nid=id||uid(); rest.order=rest.order??i+1; S[kind].set(nid,rest); queueSave(kind,nid,0); }); }
  if(d.settings){ S.settings={...DEFAULT_SETTINGS,...d.settings}; queueSave('settings',null,0); }
  renderLeft(); schedulePreview(); const t=$('#toast2'); if(t) t.textContent='Sauvegarde restaurée.';
}
document.addEventListener('input', ev=>{
  const el=ev.target; const form=el.closest('[data-form]'); if(!form) return;
  const fk=form.dataset.form;
  if(fk==='settings'){ if(el.dataset.k){ S.settings[el.dataset.k]=el.value; queueSave('settings',null); schedulePreview(); } return; }
  const id=form.dataset.id, e=S[fk].get(id); if(!e) return;
  if(el.dataset.k){ const k=el.dataset.k; e[k]= el.type==='checkbox'?el.checked:el.value; if(k==='color'){ form.querySelectorAll('.ed-swb').forEach(x=>x.setAttribute('aria-pressed','false')); } }
  else if(el.dataset.step!==undefined){ e.steps[Number(el.dataset.step)][el.dataset.sk]=el.value; }
  else if(el.dataset.tile!==undefined){ e.tiles[Number(el.dataset.tile)][el.dataset.tk]=el.value; }
  else if(el.dataset.obj!==undefined){ e.obj[Number(el.dataset.obj)]=el.value; }
  else if(el.dataset.sec!==undefined){ e.secs[Number(el.dataset.sec)][el.dataset.xk]=el.value; }
  else return;
  queueSave(fk,id); schedulePreview();
  if(['title','name','role','place','st','cat'].includes(el.dataset.k)){ const it=document.querySelector(`[data-pick="${id}"]`); if(it){ const l=sorted(fk).find(x=>x.id===id); it.querySelector('b').textContent= fk==='journal'?(l.title||'Sans titre'):(l.name||'Sans nom'); it.querySelector('small').textContent= fk==='journal'?[l.place,STATUS[l.st||'live']].filter(Boolean).join(' · '):(l.role||''); } }
});
document.addEventListener('change', ev=>{ const el=ev.target; if(el.dataset && (el.dataset.k==='cat'||el.dataset.k==='color'||el.dataset.k==='st')) renderLeftIfIdle(); });
window.addEventListener('beforeunload', ()=>{ Object.keys(timers).forEach(k=>{ clearTimeout(timers[k]); }); });

/* ---------------- boot ---------------- */
renderLeft(); renderPreview(); setStatus('', 'Connexion…');
(async()=>{
  let db=null; try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db=null; }
  if(!db){ localLoad(); S.db=null; refreshStatus(); renderLeft(); renderPreview(); return; }
  S.db=db; refreshStatus();
  const onErr = e => setStatus('err', 'Connexion à la base perdue, recharge la page');
  db.collection('journal').orderBy('order').onSnapshot(s=>applySnap('journal',s), onErr);
  db.collection('codex').orderBy('order').onSnapshot(s=>applySnap('codex',s), onErr);
  db.doc('settings/main').onSnapshot(d=>{ if(d.exists && !dirty.has('settings/main')){ S.settings={...DEFAULT_SETTINGS,...d.data()}; if(S.tab==='settings') renderLeftIfIdle(); schedulePreview(); } }, onErr);
})();
</script>
